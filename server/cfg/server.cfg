// STALKER RP — пример server.cfg. Положите в garrysmod/cfg/server.cfg и заполните.
// Режим задаётся параметром запуска: +gamemode darkrp

hostname "STALKER RP | Зона отчуждения"
sv_password ""
rcon_password "СМЕНИТЕ_ЭТОТ_ПАРОЛЬ"
sv_lan 0
sv_region 3

// Язык DarkRP и серверных сообщений (русская локализация в darkrpmodification).
gmod_language "ru"

// Иконки и панели КПК скачиваются игроками с сервера. FastDL ускоряет загрузку.
sv_allowdownload 1
sv_allowupload 0
// sv_downloadurl "https://fastdl.example.com/garrysmod/"

// Песочница: ролевой сервер без спавна NPC, оружия и транспорта игроками.
sbox_noclip 0
sbox_godmode 0
sbox_playershurtplayers 1
sbox_weapons 0
sbox_maxprops 20
sbox_maxragdolls 0
sbox_maxnpcs 0
sbox_maxvehicles 0
sbox_maxsents 0
sbox_maxeffects 0
sbox_maxballoons 0
sbox_maxdynamite 0
sbox_maxthrusters 0
sbox_maxwheels 0
sbox_maxhoverballs 0
sbox_maxemitters 0
sbox_maxcameras 0
sbox_maxbuttons 4
sbox_maxlamps 2
sbox_maxlights 2

// STALKER Inventory хранит данные в SQLite (stalker_inv_storage sqlite по умолчанию) —
// торговля и разделка без этого не работают, режим json оставьте только для отладки.

// MOTD ULX настраивается не здесь, а в data/ulx/config.txt (ulx showMotd 0 — выключить).
// Новичкам и так показывается «Памятка сталкера» (!help).

// Сеть
sv_minrate 20000
sv_maxrate 0
net_maxfilesize 64
